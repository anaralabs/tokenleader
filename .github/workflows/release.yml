# Tag-driven release pipeline. ONE channel: push an annotated tag `vX.Y.Z`
# (cut with scripts/release.sh) and this workflow builds the darwin AND linux
# daemons on native runners, emits the dual-shape manifest from one place,
# creates the GitHub release (draft -> published flip = the atomic publication
# event), and pushes the multi-arch server image to ghcr.
#
# Why the build is split across runners: `bun build --compile` cross-compiles
# fine, but only a NATIVE runner can EXECUTE the artifact, and executing it is
# what guards (b) and (f) are for. Linux therefore gets stronger release
# coverage than darwin has (see guard (b)'s note on Rosetta/AVX2).
#
# COUPLING, ON PURPOSE: `manifest` needs BOTH build jobs, so a `daemons-linux`
# failure (a queued-out ubuntu-24.04-arm runner class, an apt mirror error in
# guard (b2)) blocks the darwin release too — including a macOS-only hotfix
# for the 23 fielded Macs. The alternative is worse: publishing a darwin-only
# manifest DE-LISTS `platforms.linux-*`, and every fielded Linux daemon then
# resolves no entry for its arch and stops updating until the next tag. If you
# are cutting an emergency darwin fix and linux CI is wedged, do NOT hand-edit
# a short manifest — use scripts/publish-release.sh, which cross-compiles all
# four binaries locally and emits the same four-platform manifest.
#
# Versioning: TAGS ARE THE VERSION. package.json stays 0.1.0 and is not
# consulted — there is deliberately NO tag==package.json guard.
# The guards that do run fail the BUILD, never the fleet:
#   (b) `--version` field 1 of every built binary == the tag (a manifest/
#       binary version divergence would false-flag the whole fleet as stale
#       on /stats/fleet);
#   (b2) the linux-x64 artifact runs on a pre-AVX2 CPU (qemu -cpu Nehalem),
#       skipped-with-a-warning if the emulator itself can't run it.
#       It is compiled from bun's `-baseline` target on purpose: cheap and
#       virtualised VPS hosts mask AVX2 (Proxmox/QEMU default kvm64/qemu64
#       CPU models do it on brand-new silicon), and the failure mode is a
#       diagnostic-free SIGILL crash-loop under Restart=always. This guard is
#       the executable proof nobody has quietly "optimised" the target back.
#   (c) legacy manifest arm64/x64 keys byte-equal their platforms.darwin-*
#       mirrors (the fleet-frozen v1 consumer shape). NEVER extend it to
#       linux: the legacy keys mean darwin forever;
#   (c2) the manifest carries linux-x64 + linux-arm64, neither shares a sha
#       with a darwin entry, and they do not share one with each other
#       (catches a cross-wired artifact upload / both matrix legs pointed at
#       the same target);
#   (e) no .env/.env.local at build time (`bun build --compile` can inline
#       build-cwd env files into compiled binaries).
#
# Secrets: NONE beyond the implicit GITHUB_TOKEN. CI does not render
# install/uninstall scripts (the running server renders them at request
# time) and does not bake server URLs into anything.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  daemons:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # Daemon compile pin — unified with ci.yml on the latest stable bun.
          # 1.1.x `build --compile` baked bun's own Developer-ID (Jarred Sumner)
          # into the binary AND produced output codesign couldn't re-sign, so
          # the LaunchAgent showed up as "Jarred Sumner" in macOS background
          # activity. 1.3.x is re-signable; build-daemon.sh stamps our own
          # identity. The streaming auto-update download path is covered by
          # src/daemon/update.test.ts (runs on this pin in ci.yml).
          bun-version: "1.3.14"

      - name: Guard (e) — no env files in the build cwd
        # `bun build --compile` has historically inlined .env/.env.local from
        # the cwd into the binary. A fresh checkout should never have them;
        # this guard stays as cheap insurance regardless of bun version.
        run: test ! -e .env -a ! -e .env.local

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build darwin daemons (version = tag)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/build-daemon.sh bun-darwin-arm64 bin/tokenleader-darwin-arm64
          bash scripts/build-daemon.sh bun-darwin-x64 bin/tokenleader-darwin-x64
          ls -lh bin/

      - name: Guard (b) — built binaries report the tag
        # arm64 runs natively on the macos-14 arm64 runner and is executed
        # for the real --version check. The x64 binary cannot be executed
        # here: Rosetta 2 on macOS 14 lacks AVX2, which Bun's darwin-x64
        # (non-baseline) builds use — it dies with SIGILL (exit 132). Every
        # Intel Mac since 2013 has AVX2, so the binary is fine in the
        # field; verify its baked tag by byte inspection instead.
        run: |
          set -euo pipefail
          got="$(bin/tokenleader-darwin-arm64 --version | awk '{print $1}')"
          if [ "${got}" != "${GITHUB_REF_NAME}" ]; then
            echo "guard (b) failed: arm64 --version reports '${got}', tag is '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "guard (b) ok: bin/tokenleader-darwin-arm64 -> ${got} (executed)"
          if ! grep -q "${GITHUB_REF_NAME}" bin/tokenleader-darwin-x64; then
            echo "guard (b) failed: tag '${GITHUB_REF_NAME}' not embedded in the x64 binary" >&2
            exit 1
          fi
          echo "guard (b) ok: bin/tokenleader-darwin-x64 -> ${GITHUB_REF_NAME} (embedded-bytes check; not executable on this runner)"

      - name: Guard (f) — released binary completes a real update cycle
        # Tests run under bun; the fleet runs the COMPILED binary — a
        # different runtime surface (the v0.5.x silent-exit fetch kill
        # shipped through a fully green suite). This executes the actual
        # arm64 artifact and drives it through manifest → curl download →
        # sha verify → smoke test → swap → exit(75) against a local server.
        run: |
          VERSION=v0.0.0-updategate bash scripts/build-daemon.sh '' /tmp/gate-next
          bun scripts/update-gate.ts bin/tokenleader-darwin-arm64 /tmp/gate-next

      - uses: actions/upload-artifact@v4
        with:
          name: release-bin-darwin
          path: |
            bin/tokenleader-darwin-arm64
            bin/tokenleader-darwin-x64
          if-no-files-found: error

  daemons-linux:
    strategy:
      # Let BOTH legs report. With fail-fast a flaky x64 leg cancels arm64 and
      # the rerun tells you nothing about whether arm64 was also broken —
      # and the whole tag is blocked either way (see COUPLING in the header).
      fail-fast: false
      matrix:
        include:
          # Native runners so guards (b) and (f) can EXECUTE the artifacts.
          - runner: ubuntu-24.04
            arch: x64
            # BASELINE on purpose — see guard (b2) in the header.
            target: bun-linux-x64-baseline
          - runner: ubuntu-24.04-arm
            arch: arm64
            # bun-linux-arm64-baseline is an alias of bun-linux-arm64 (same
            # ELF BuildID); there is no separate arm64 baseline runtime.
            target: bun-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Guard (e) — no env files in the build cwd
        run: test ! -e .env -a ! -e .env.local

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build linux daemon (version = tag)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/build-daemon.sh ${{ matrix.target }} bin/tokenleader-linux-${{ matrix.arch }}
          ls -lh bin/

      - name: Guard (b) — built binary reports the tag (executed natively)
        run: |
          set -euo pipefail
          got="$(bin/tokenleader-linux-${{ matrix.arch }} --version | awk '{print $1}')"
          if [ "${got}" != "${GITHUB_REF_NAME}" ]; then
            echo "guard (b) failed: linux-${{ matrix.arch }} --version reports '${got}', tag is '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "guard (b) ok: bin/tokenleader-linux-${{ matrix.arch }} -> ${got} (executed)"

      - name: Guard (b2) — linux-x64 runs on a pre-AVX2 CPU
        if: matrix.arch == 'x64'
        # qemu-user with an SSE4.2-era CPU mask distinguishes the two bun
        # targets: non-baseline dies with SIGILL (exit 132), baseline runs.
        #
        # THE TOOLING IS NOT THE PROPERTY. Two things can fail here: the
        # emulator (apt mirror hiccup, a qemu-user bug — reproduced locally,
        # where qemu-user on an arm64 host dies with its own internal SIGSEGV
        # before the guest starts) and the artifact. Only the second is a
        # release-blocking fact. So: prove qemu can run this binary AT ALL
        # first; if it cannot, warn and move on rather than burning a tag on
        # infrastructure. If the unmasked run works and the masked run does
        # not, that IS the AVX2 regression and it fails the build.
        run: |
          set -uo pipefail
          if ! (sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static); then
            echo "::warning::guard (b2) SKIPPED — could not install qemu-user-static"
            exit 0
          fi
          if ! qemu-x86_64-static bin/tokenleader-linux-x64 --version >/dev/null 2>&1; then
            echo "::warning::guard (b2) SKIPPED — qemu-user cannot run the artifact even unmasked (emulator problem, not an artifact problem)"
            exit 0
          fi
          if ! qemu-x86_64-static -cpu Nehalem bin/tokenleader-linux-x64 --version; then
            echo "guard (b2) failed: the linux-x64 artifact needs a post-Nehalem CPU." >&2
            echo "It must be built from bun's -baseline target: cheap/virtualised VPS" >&2
            echo "hosts mask AVX2 and the failure there is a silent SIGILL crash-loop." >&2
            exit 1
          fi
          echo "guard (b2) ok: baseline artifact runs without AVX2"

      - name: Guard (f) — released binary completes a real update cycle
        run: |
          VERSION=v0.0.0-updategate bash scripts/build-daemon.sh ${{ matrix.target }} /tmp/gate-next
          bun scripts/update-gate.ts bin/tokenleader-linux-${{ matrix.arch }} /tmp/gate-next

      - uses: actions/upload-artifact@v4
        with:
          name: release-bin-linux-${{ matrix.arch }}
          path: bin/tokenleader-linux-${{ matrix.arch }}
          if-no-files-found: error

  manifest:
    # ONE manifest, hashed from every artifact in one place. make-manifest
    # throws when a platform's binary is missing, so a partially-failed matrix
    # cannot silently publish a short manifest.
    needs: [daemons, daemons-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: release-bin-*
          merge-multiple: true

      - name: Build manifest.json (dual shape)
        run: |
          ls -lh bin/
          bun scripts/make-manifest.ts --version "${GITHUB_REF_NAME}" --bin-dir bin --out bin/manifest.json

      - name: Guard (c) — legacy keys byte-equal the darwin platforms map
        run: |
          jq -e '.version == env.GITHUB_REF_NAME
                 and .arm64 == .platforms."darwin-arm64"
                 and .x64 == .platforms."darwin-x64"' bin/manifest.json

      - name: Guard (c2) — linux entries exist and are not darwin bytes
        run: |
          jq -e '(.platforms."linux-x64".sha256 | test("^[0-9a-f]{64}$"))
                 and (.platforms."linux-arm64".sha256 | test("^[0-9a-f]{64}$"))
                 and (.platforms."linux-x64".sha256 != .platforms."darwin-x64".sha256)
                 and (.platforms."linux-x64".sha256 != .platforms."darwin-arm64".sha256)
                 and (.platforms."linux-arm64".sha256 != .platforms."darwin-x64".sha256)
                 and (.platforms."linux-arm64".sha256 != .platforms."darwin-arm64".sha256)
                 and (.platforms."linux-x64".sha256 != .platforms."linux-arm64".sha256)' bin/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: bin/manifest.json
          if-no-files-found: error

  publish-release:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: release-*
          merge-multiple: true

      - name: Legacy-named asset copies for the fielded fleet
        # Fielded DARWIN daemons (and server mirrors) still fetch
        # `anara-leaderboard-{arm64,x64}`. Publish byte-identical
        # copies under the legacy names alongside the canonical ones.
        # Linux deliberately gets NO legacy alias: there is no fielded linux
        # daemon to be compatible with, and the mirror fetches the canonical
        # `tokenleader-linux-*` names directly.
        run: |
          cp bin/tokenleader-darwin-arm64 bin/anara-leaderboard-arm64
          cp bin/tokenleader-darwin-x64 bin/anara-leaderboard-x64
          ls -lh bin/

      - name: Create draft release, upload, then flip live
        # Draft -> published is the atomic publication event: the
        # `releases/latest` marker never sees a half-uploaded release.
        # Stable tags get --latest (what daemons/mirrors follow); tags
        # containing '-' (rc/prerelease) get --prerelease and must NEVER
        # take the latest marker — that would roll the live fleet.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --draft \
            --title "${TAG}" \
            --notes "tokenleader ${TAG} — daemon binaries + manifest. Server image: ghcr.io/${GH_REPO%%/*}/tokenleader:${TAG}." \
            bin/tokenleader-darwin-arm64 \
            bin/tokenleader-darwin-x64 \
            bin/tokenleader-linux-x64 \
            bin/tokenleader-linux-arm64 \
            bin/anara-leaderboard-arm64 \
            bin/anara-leaderboard-x64 \
            bin/manifest.json
          case "${TAG}" in
            *-*) gh release edit "${TAG}" --draft=false --prerelease ;;
            *)   gh release edit "${TAG}" --draft=false --latest ;;
          esac
          echo "Published ${TAG}."

  server-image:
    needs: publish-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per arch — NO QEMU (bun install under qemu-user is
          # slow/flaky). Each leg pushes by digest; the
          # image-manifest job stitches the multi-arch tags.
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Derive lowercase image name
        id: image
        # ghcr requires a lowercase namespace; github.repository_owner can
        # carry uppercase. Image name is ghcr.io/<owner>/tokenleader
        # regardless of the repo's own name.
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tokenleader" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SERVER_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: server-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        # ghcr.io/<owner>/tokenleader:<tag> always; :latest only for stable
        # tags (compose + Watchtower adopters track :latest — an rc must
        # never roll them, same condition as --prerelease above).
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tokenleader"
          TAGS=(-t "${IMAGE}:${GITHUB_REF_NAME}")
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease tag — skipping :latest" ;;
            *)   TAGS+=(-t "${IMAGE}:latest") ;;
          esac
          cd /tmp/digests
          # shellcheck disable=SC2046
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
